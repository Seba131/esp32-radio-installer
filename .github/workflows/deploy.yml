name: Deploy do GitHub Pages

# Publikuje strone instalatora przy kazdym pushu do main.
# Wymaga: Settings -> Pages -> Source = "GitHub Actions".
# Firmware NIE jest budowany tutaj — pliki .bin musza pochodzic z build-full-bin.ps1 (repo glowne).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz repo
        uses: actions/checkout@v4

      - name: Weryfikacja plikow firmware
        run: |
          set -e
          REQUIRED=(
            bootloader.bin
            partitions.bin
            boot_app0.bin
            firmware.bin
            firmware-ili9488.bin
            firmware-lcd19.bin
            firmware-1732s019.bin
            littlefs.bin
            manifest.json
            manifest-ili9488.json
            manifest-lcd19.json
            manifest-1732s019.json
            manifest-xmc.json
            manifest-ili9488-xmc.json
            manifest-lcd19-xmc.json
            manifest-1732s019-xmc.json
            xmc-retry/bootloader-xmc-retry.bin
            index.html
          )
          MISSING=0
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Brak pliku: $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo ""
            echo "Uruchom w repo glownym esp32-radio: .\\build-full-bin.ps1"
            echo "Nastepnie commit + push wszystkich .bin do tego repozytorium (installer)."
            exit 1
          fi

          # littlefs.bin musi pasowac do partycji (0x360000 B) z partitions.csv
          # (AUDYT 2026-08-22: skrocone z 0x370000 - patrz build-full-bin.ps1
          # w repo glownym, partycja spiffs zmniejszona o 64KB pod coredump)
          LITTLEFS_MAX=3538944
          LITTLEFS_SIZE=$(stat -c%s littlefs.bin)
          if [ "$LITTLEFS_SIZE" -gt "$LITTLEFS_MAX" ]; then
            echo "::error::littlefs.bin ma ${LITTLEFS_SIZE} B, max ${LITTLEFS_MAX} B (partycja spiffs)"
            exit 1
          fi

          FIRMWARE_MIN=100000
          for fw in firmware.bin firmware-ili9488.bin firmware-lcd19.bin firmware-1732s019.bin; do
            FIRMWARE_SIZE=$(stat -c%s "$fw")
            if [ "$FIRMWARE_SIZE" -lt "$FIRMWARE_MIN" ]; then
              echo "::error::$fw podejrzanie maly (${FIRMWARE_SIZE} B)"
              exit 1
            fi
          done

          # Kazdy plik wskazany w KAZDYM manifest*.json musi istniec - inaczej
          # przycisk danego wariantu (lub przelacznik XMC) dalby 404 dopiero
          # u uzytkownika. Lapie tez przyszle warianty spoza listy REQUIRED.
          python3 - <<'PY'
          import glob, json, os, sys
          bad = 0
          for m in sorted(glob.glob("manifest*.json")):
              try:
                  data = json.load(open(m, encoding="utf-8"))
                  parts = [p for b in data["builds"] for p in b["parts"]]
              except Exception as e:
                  print(f"::error::{m}: niepoprawny manifest ({e})"); bad = 1; continue
              for p in parts:
                  if not os.path.isfile(p["path"]):
                      print(f"::error::{m}: brak pliku {p['path']}"); bad = 1
          sys.exit(bad)
          PY

          echo "Pliki firmware OK:"
          ls -lh *.bin manifest*.json

      - name: Konfiguracja Pages
        uses: actions/configure-pages@v5

      - name: Spakuj zawartosc (caly katalog)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
